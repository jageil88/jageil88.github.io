<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbinden – Durchgespielt</title>
<link rel="stylesheet" href="style.css">
</head>
<body><main>
<h1>Fast geschafft</h1>
<p id="status">Du wirst zur Zentrale auf deinem PC weitergeleitet …</p>
<p class="leise">Klappt das nicht, öffne diese Seite auf dem PC, auf dem die Zentrale läuft.</p>
<p><a id="weiter" href="http://127.0.0.1:8787/#system">Zur Zentrale</a></p>
<script>
  // TikTok schickt code und state hierher; die Zentrale auf dem PC holt damit den Zugang ab.
  const q = new URLSearchParams(location.search);
  if (q.get("state")) {
    const ziel = "http://127.0.0.1:8787/tiktok/callback" + location.search;
    document.getElementById("weiter").href = ziel;
    location.replace(ziel);
  } else {
    document.getElementById("status").textContent = "Diese Seite wird nur beim Verbinden mit TikTok gebraucht.";
  }
</script>
</main></body>
</html>
